  "MD046",
  "MD047",
]

# MD007 (list indentation) is dropped: it misfires on the lists nested inside
# blockquotes that these docs use for callouts, and there is no real nested-list
# convention here to enforce.
#
# MD013 (line length) is dropped: prose paragraphs are deliberately left
# unwrapped (see CLAUDE.md's writing conventions) rather than hard-wrapped.
#
# MD036 (emphasis instead of a heading) is dropped: "Claims are bolded
# lead-ins followed by the reasoning" is this project's documented style
# (CLAUDE.md, "Writing conventions in docs/"), not a mistake to flag.

[lint.md029]
style = "ordered"

[lint.md030]
ul-single = 1
ol-single = 1
ul-multi = 1
ol-multi = 1

[lint.md046]
style = "fenced"
