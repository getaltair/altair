services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_PASSWORD: altair
      POSTGRES_DB: altair
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d altair"]
      interval: 2s
      timeout: 3s
      retries: 15
