name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Matches compose.yaml. Set directly rather than via .env so the
      # workflow has no dependency on the gitignored local override file.
      DATABASE_URL: postgres://postgres:altair@localhost:5432/altair
    steps:
      - uses: actions/checkout@v4
      # mise installs rust by delegating to rustup, so the toolchain itself
      # lives in ~/.rustup and only a symlink lives under mise. Caching one
      # without the other leaves mise reporting "all tools are installed"
      # over a toolchain whose components are gone, so both are cached
      # together, under one key, or neither is.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: docker compose up -d --wait
      # --locked, so a lockfile that does not match the manifests is an error
      # rather than something cargo quietly repairs on the way past. Without it
      # a stale lockfile passes here and surfaces later somewhere unrelated,
      # which is exactly how one reached main: the merge resolved Cargo.lock to
      # one side, every local `cargo test` rewrote it and passed, and the lint
      # job reported it under the name of the clippy hook.
      #
      # This is the copy of that check that does not depend on the committer.
      # The pre-commit hook runs on a developer's machine and is skippable, and
      # neither it nor any other local hook runs on a merge commit GitHub builds
      # itself — where a Cargo.lock conflict can only be resolved by choosing a
      # side, and both sides are wrong.
      - run: cargo test --workspace --locked

  # The outbox conformance scenarios.
  #
  # `conformance/scenarios.md` specifies the outbox; Wave 1.5 wrote the suite
  # that judges it and Wave 4.1 wrote the outbox. It was `continue-on-error`
  # while the client did not exist and the red was the deliverable; it is a real
  # gate now, and a scenario going red is a client that stopped conforming.
  #
  # It stays a separate job because it launches a client process per scenario
  # and drives it for seconds at a time, and because it needs no database.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See the note in the test job.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # No database, no Authentik, no real instance: the suite stands up its own
      # fake instance on a local port and needs nothing else.
      - run: mise run conformance

  # The client on Windows, from the first commit rather than as a late
  # verification pass.
  #
  # **The Windows surface is almost entirely in what Wave 4.1 built**, which is
  # why this job exists before there is a screen to look at: the bundled SQLite
  # build is a toolchain question, an unwarned kill is `TerminateProcess`
  # rather than a signal and section B is entirely about surviving one, the
  # adapter's newline-delimited channel is where a carriage return breaks
  # something quietly, and the harness hands the client a durable directory and
  # an ephemeral one, which are names for concepts Windows does not have.
  # Finding those at the end of the wave means finding them as flakiness.
  #
  # The instance stays Linux-only and deliberately so: `altaird` is a
  # self-hosted server, DR-002 pins PostgreSQL, and the deployment story has
  # never been anything else. So this job runs the client's own tests and the
  # conformance suite, and no part of the workspace that needs a database.
  #
  # Run directly rather than through `mise run conformance`, because that task
  # is a shell script and this is the one runner without the shell it assumes.
  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p altair-tui --all-features --locked
      # The suite launches the client as a separate process, so the binary has
      # to exist first; it belongs to another package, which is why cargo will
      # not build it as a side effect of building the tests.
      - run: cargo build -p altair-tui --features conformance --bin altair --locked
      # --nocapture so a scenario the client legitimately skips prints its
      # ledger line rather than being reported "ok" beside one that passed, and
      # --test-threads=1 because several scenarios measure how long the client
      # took to answer.
      - run: cargo test -p altair-conformance --features run-conformance --test scenarios --locked -- --nocapture --test-threads=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See the note in the test job. This one is where a half-restored
      # toolchain actually bites: cargo and rustc survive it, cargo-fmt and
      # cargo-clippy do not.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Runs the same hooks configured in .pre-commit-config.yaml, so CI and
      # the local pre-commit path can never drift apart.
      - run: prek run --all-files
      # The hooks above are only as good as the toolchain behind them, and a
      # missing component makes them pass by not running. Assert the parts
      # that have gone missing are actually there.
      - run: cargo fmt --version && cargo clippy --version
