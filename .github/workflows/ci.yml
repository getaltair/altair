name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Matches compose.yaml. Set directly rather than via .env so the
      # workflow has no dependency on the gitignored local override file.
      DATABASE_URL: postgres://postgres:altair@localhost:5432/altair
    steps:
      - uses: actions/checkout@v4
      # mise installs rust by delegating to rustup, so the toolchain itself
      # lives in ~/.rustup and only a symlink lives under mise. Caching one
      # without the other leaves mise reporting "all tools are installed"
      # over a toolchain whose components are gone, so both are cached
      # together, under one key, or neither is.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: docker compose up -d --wait
      - run: cargo test --workspace

  # The outbox conformance scenarios, which are SUPPOSED to fail.
  #
  # `conformance/scenarios.md` specifies an outbox that Wave 4.1 writes; Wave
  # 1.5 wrote the suite that judges it. Until the outbox exists every scenario
  # runs against a stub client and fails, and that red is the deliverable. It is
  # `continue-on-error` so it never blocks a merge, and it is here rather than
  # nowhere so the red stays visible on every pull request and the count is
  # watched as it comes down. Do not "fix" it by deleting it — see
  # crates/altair-conformance/README.md.
  conformance:
    name: conformance (red until Wave 4.1)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # See the note in the test job.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # No database, no Authentik, no real instance: the suite stands up its own
      # fake instance on a local port and needs nothing else.
      - run: mise run conformance

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See the note in the test job. This one is where a half-restored
      # toolchain actually bites: cargo and rustc survive it, cargo-fmt and
      # cargo-clippy do not.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Runs the same hooks configured in .pre-commit-config.yaml, so CI and
      # the local pre-commit path can never drift apart.
      - run: prek run --all-files
      # The hooks above are only as good as the toolchain behind them, and a
      # missing component makes them pass by not running. Assert the parts
      # that have gone missing are actually there.
      - run: cargo fmt --version && cargo clippy --version
